# =============================================================================
# Render Blueprint - NhacCuaHoiKS (Next.js + PostgreSQL/Neon)
# -----------------------------------------------------------------------------
# Cach dung:
#   1. Dang nhap render.com -> New + -> Blueprint -> chon repo nay (render.yaml o goc).
#   2. Render se hoi 2 bien bi mat (DATABASE_URL, AUTH_URL) - dan gia tri vao:
#        DATABASE_URL = chuoi ket noi POOLED cua Neon (co "-pooler", nho ?sslmode=require)
#        AUTH_URL     = https://<ten-dich-vu>.onrender.com  (hoac ten mien rieng)
#   3. AUTH_SECRET do Render tu sinh (generateValue) - khong can nhap.
# =============================================================================
services:
  - type: web
    name: nhaccuahoiks
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    # `prisma generate` la BAT BUOC: thu muc src/generated/ khong duoc commit len git.
    # `prisma migrate deploy` tao/ cap nhat bang tren Neon theo prisma/migrations.
    #
    # MIGRATION PHAI CHAY QUA KET NOI TRUC TIEP (bo "-pooler"): pooler cua Neon (PgBouncer) lam
    # `pg_advisory_lock` cua Prisma bi treo -> "Error: P1002 ... advisory lock" -> deploy that bai.
    # Uu tien bien DIRECT_URL; khong co thi tu bo hau to "-pooler" khoi DATABASE_URL.
    buildCommand: >-
      npm ci && npx prisma generate &&
      (MIGRATE_URL="${DIRECT_URL:-$DATABASE_URL}";
      MIGRATE_URL=$(printf '%s' "$MIGRATE_URL" | sed 's/-pooler//');
      DATABASE_URL="$MIGRATE_URL" npx prisma migrate deploy) &&
      npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      # --- Database (Neon) ---
      # Chuoi ket noi pooled: postgresql://user:pass@ep-xxx-pooler.<region>.aws.neon.tech/db?sslmode=require
      - key: DATABASE_URL
        sync: false

      # (Nen dat) Chuoi ket noi TRUC TIEP cua Neon - bo "-pooler" khoi host. Chi dung cho buoc
      # `prisma migrate deploy` (PgBouncer lam advisory lock cua Prisma bi treo -> loi P1002).
      # Bo trong cung duoc: buildCommand tu bo hau to "-pooler" khoi DATABASE_URL.
      - key: DIRECT_URL
        sync: false

      # --- Auth.js ---
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      # HTTPS -> cookie phai la __Secure- (xem src/auth.config.ts)
      - key: AUTH_USE_SECURE_COOKIES
        value: "true"

      # --- Giao dien ---
      - key: NEXT_PUBLIC_APP_NAME
        value: NhacCuaHoiKS

      # --- Storage cho file upload ---
      # LUU Y: o dia cua Render la TAM THOI - file upload se mat moi lan deploy lai.
      #  - Chi dung "local" khi thu nghiem (bai demo).
      #  - Muon giu file: doi STORAGE_DRIVER=s3 va dien S3_* ben duoi (hoac gan Render Disk,
      #    chi co o goi tra phi: disk.mountPath = /opt/render/project/src/.data/uploads).
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: .data/uploads
      - key: STORAGE_PUBLIC_PREFIX
        value: /api/files
      - key: UPLOAD_MAX_BYTES
        value: "52428800"
      # S3: chi can dien khi doi STORAGE_DRIVER sang "s3" (xem ghi chu o tren)
      - key: S3_ENDPOINT
        value: ""
      - key: S3_REGION
        value: ""
      - key: S3_BUCKET
        value: ""
      - key: S3_ACCESS_KEY_ID
        value: ""
      - key: S3_SECRET_ACCESS_KEY
        value: ""
      - key: S3_PUBLIC_BASE_URL
        value: ""

      # --- Tuy chon: metadata YouTube/SoundCloud ---
      # De trong = khong dung API (van lay duoc metadata qua oEmbed/hydration nhu binh thuong).
      # Dien sau trong dashboard Render neu can.
      - key: YOUTUBE_API_KEY
        value: ""
      - key: SOUNDCLOUD_CLIENT_ID
        value: ""
      - key: METADATA_TIMEOUT_MS
        value: "8000"

    # --- TUY CHON cho goi tra phi: giu file upload qua cac lan deploy ---
    # Bo comment khoi nay (va doi STORAGE_DRIVER=local thanh gia tri duoi day) neu muon giu file:
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/.data/uploads
    #   sizeGB: 1

# =============================================================================
# NhacCuaHoiKS - docker compose: chay ung dung Next.js voi CSDL PostgreSQL
# -----------------------------------------------------------------------------
# Mac dinh dung Neon: dien DATABASE_URL (chuoi pooled) trong .env.
# Muon chay PostgreSQL ngay tren may: bo comment service `postgres` ben duoi va doi
# DATABASE_URL thanh: postgresql://nhac:matkhau@postgres:5432/nhaccuahoiks?sslmode=disable
#
# Su dung:  docker compose up -d --build
# =============================================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nhaccuahoiks-app
    environment:
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL:?Thieu DATABASE_URL - hay dat trong file .env}"
      AUTH_SECRET: "${AUTH_SECRET:?Thieu AUTH_SECRET - hay dat trong file .env}"
      AUTH_URL: "${AUTH_URL:-http://localhost:3000}"
      AUTH_TRUST_HOST: "true"
      STORAGE_DRIVER: "local"
      STORAGE_LOCAL_DIR: "/app/.data/uploads"
      STORAGE_PUBLIC_PREFIX: "/api/files"
      UPLOAD_MAX_BYTES: "104857600"
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      NEXT_PUBLIC_APP_NAME: "NhacCuaHoiKS"
    ports:
      - "3000:3000"
    volumes:
      - app-uploads:/app/.data/uploads

  # ---------------------------------------------------------------------------
  # TUY CHON: PostgreSQL chay ngay tren may (khong can internet).
  # Bo comment khoi nay neu ban khong dung Neon/CSDL tu xa. Nho khai bao
  # POSTGRES_USER + POSTGRES_PASSWORD trong .env truoc khi chay.
  # ---------------------------------------------------------------------------
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: nhaccuahoiks-postgres
  #   environment:
  #     POSTGRES_DB: nhaccuahoiks
  #     POSTGRES_USER: "${POSTGRES_USER:?Thieu POSTGRES_USER - hay dat trong file .env}"
  #     POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Thieu POSTGRES_PASSWORD - hay dat trong file .env}"
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d nhaccuahoiks"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10

volumes:
  app-uploads:
  # postgres-data:
